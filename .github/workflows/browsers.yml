name: Browser libraries

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browsers-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PYTHONUNBUFFERED: '1'
      SNEK_BROWSER: ${{ matrix.browser }}
      SNEK_RUNTIME: node
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '25.9.0'
      - name: Install pinned browser and optimizer dependencies
        run: |
          python -m pip install -r tests/requirements-browser.txt
          python -m playwright install --with-deps "$SNEK_BROWSER"
          npm install --prefix "$RUNNER_TEMP/snek-tools" --no-audit --no-fund binaryen@132.0.0
          echo "SNEK_WASM_OPT=$RUNNER_TEMP/snek-tools/node_modules/.bin/wasm-opt" >> "$GITHUB_ENV"
      - name: Rebuild self-hosted compiler and verify fixed point
        run: python bootstrap/bootstrap_compiler.py
      - name: Both compilers, raw and optimized, main thread and worker
        run: python tests/run_suites.py browser
