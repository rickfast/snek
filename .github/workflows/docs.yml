name: Documentation

on:
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml', 'README.md', 'DESIGN.md', 'bootstrap/README.md', 'bench/README.md', 'packaging/README.md', 'tests/README.md', 'snek/**', 'snekc/**', 'bootstrap/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'mkdocs.yml', 'README.md', 'DESIGN.md', 'bootstrap/README.md', 'bench/README.md', 'packaging/README.md', 'tests/README.md', 'snek/**', 'snekc/**', 'bootstrap/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.14'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '25.9.0'
      - name: Install locked documentation dependencies
        run: python -m pip install --require-hashes -r docs/requirements.txt
      - name: Build and verify the playground compiler
        env:
          SNEK_RUNTIME: node
        run: |
          python bootstrap/bootstrap_compiler.py
          python docs/tools/prepare_playground.py
      - name: Test the deployed playground in Chromium
        run: |
          python -m pip install -r tests/requirements-browser.txt
          python -m playwright install --with-deps chromium
          python tests/run_suites.py playground
      - name: Build documentation and validate examples and links
        run: |
          python -m mkdocs build --strict
          python docs/tools/check.py
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
