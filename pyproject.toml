[project]
name = "snek"
version = "0.1.0"
description = "A statically typed Python subset compiled to WebAssembly (WasmGC + WASI)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
run = ["wasmtime>=47"]

[project.scripts]
snekc = "snekc.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["snekc", "snek", "bootstrap"]
include-package-data = false

[tool.setuptools.package-data]
snekc = ["prelude.wat", "node_wasi.mjs", "component_runtime.wat", "component_input.wat", "abi_memory.wat", "library_runtime.wat", "library.js", "wit/*.wit", "wit/deps/*.wit", "runtime/*.snek"]
bootstrap = ["data/*.txt"]
